<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Care | Farmer Dashboard</title>
    <link rel="stylesheet" href="farmers.css" />
</head>

<body>
    <header>
        <h1>🌿 Farm Care — Farmer Dashboard</h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="#preview-grid">My Uploads</a>
            <a href="#" id="logout-btn">Logout</a>
        </nav>
    </header>

    <main>
        <section class="upload-section">
            <h2>Upload Your Fresh Produce</h2>
            <p>Share your farmers freshest harvest with consumers directly!</p>

            <form id="uploadForm">

                <!-- Group 1: Produce Name -->
                <div style="margin-bottom: 15px;">
                    <label for="produce-name" style="display:block; margin-bottom:5px; font-weight:bold;">Produce
                        Name:</label>
                    <input type="text" id="produce-name" placeholder="e.g. Mangoes 🥭" required
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <!-- Group 1.5: Price & Quantity (Stock) -->
                <div style="margin-bottom: 15px;">
                    <div style="display: flex; gap: 15px;">
                        <div style="flex: 1;">
                            <label for="produce-price" style="display:block; margin-bottom:5px; font-weight:bold;">Price
                                (₹):</label>
                            <input type="number" id="produce-price" placeholder="e.g. 50" required
                                style="width: 100%; box-sizing: border-box;" />
                        </div>
                        <div style="flex: 1;">
                            <label for="produce-qty" style="display:block; margin-bottom:5px; font-weight:bold;">Stock
                                (kg):</label>
                            <input type="number" id="produce-qty" placeholder="e.g. 10" required
                                style="width: 100%; box-sizing: border-box;" />
                        </div>
                    </div>
                </div>

                <!-- Group 2: Category & Harvest Date (Row) -->
                <div style="margin-bottom: 15px;">
                    <div style="display: flex; gap: 15px;">
                        <div style="flex: 1;">
                            <label for="produce-category"
                                style="display:block; margin-bottom:5px; font-weight:bold;">Category:</label>
                            <select id="produce-category" required
                                style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;">
                                <option value="" disabled selected>Select Category</option>
                                <option value="Vegetables">Vegetables 🥦</option>
                                <option value="Fruits">Fruits 🍎</option>
                                <option value="Dairy">Dairy 🥛</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label for="harvest-date"
                                style="display:block; margin-bottom:5px; font-weight:bold;">Harvest Date:</label>
                            <input type="date" id="harvest-date" required
                                style="width: 100%; box-sizing: border-box;" />
                        </div>
                    </div>
                </div>

                <!-- Group 3: Description -->
                <div style="margin-bottom: 15px;">
                    <label for="produce-desc"
                        style="display:block; margin-bottom:5px; font-weight:bold;">Description:</label>
                    <textarea id="produce-desc" rows="3"
                        placeholder="Describe your produce (e.g. Organic, fresh picked)..." required
                        style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-family: inherit;"></textarea>
                </div>

                <!-- Group 4: Freshness -->
                <div style="margin-bottom: 15px;">
                    <label for="freshness" style="display:block; margin-bottom:5px; font-weight:bold;">Freshness Scale
                        (1–10):</label>
                    <div class="freshness-scale"
                        style="background:#e8f5e9; padding: 10px; border-radius: 10px; display:flex; align-items:center;">
                        <input type="range" id="freshness" min="1" max="10" value="8"
                            style="margin-bottom: 0; flex:1; margin-right:10px;"
                            oninput="updateFreshness(this.value)" />
                        <span id="freshness-value" style="font-size: 1.2rem; min-width:80px; text-align:right;">8 / 10
                            🌱</span>
                    </div>
                </div>

                <!-- Group 5: Image -->
                <div style="margin-bottom: 20px;">
                    <label for="produce-image" style="display:block; margin-bottom:5px; font-weight:bold;">Upload
                        Produce Image:</label>
                    <input type="file" id="produce-image" accept="image/*" required
                        style="border: 2px dashed #2d572c; background: #f0fdf4; width: 100%; box-sizing: border-box; padding:10px;" />
                </div>

                <button type="submit" style="width: 100%; font-size: 1.2rem;">🚀 Upload Produce</button>
            </form>
        </section>

        <section class="preview-section">
            <h3>My Uploaded Produce</h3>
            <p>Your recently uploaded fruits and vegetables will appear below.</p>
            <div id="preview-grid" class="preview-grid">
                <!-- Farmer’s uploaded items will appear here dynamically -->
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Farm Care | Empowering Farmers with Technology 🌾</p>
    </footer>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        // Logout
        document.getElementById("logout-btn").onclick = () => {
            localStorage.clear();
            window.location.href = "login.html";
        };

        // Update freshness value display
        function updateFreshness(val) {
            const valueText = document.getElementById("freshness-value");
            const emojis = ["😐", "🙂", "😊", "😁", "😄", "😃", "😋", "🥰", "🌿", "💚"];
            valueText.textContent = `${val} / 10 ${emojis[val - 1]}`;
        }

        // Load Products
        async function loadProducts() {
            try {
                const res = await fetch('http://localhost:5000/api/products');
                const data = await res.json();
                const grid = document.getElementById("preview-grid");
                grid.innerHTML = '';

                if (data.success) {
                    const currentUserEmail = localStorage.getItem('email') || "";
                    const currentUserRole = localStorage.getItem('userType');

                    // 🛠 Display User Info
                    const userName = localStorage.getItem('username') || "Farmer";
                    document.querySelector('header h1').innerHTML = `🌿 Farm Care — Welcome, ${userName} 🚜`;

                    // Filter products by current user's email
                    // Handle case where product.farmer might be null (orphaned) or not populated
                    const myProducts = data.data.filter(product => {
                        if (!product.farmer) return false;
                        return product.farmer.email === currentUserEmail;
                    });

                    if (myProducts.length === 0) {
                        grid.innerHTML = `
                            <div style="text-align: center; width: 100%; color: #666;">
                                <p>No uploads found for account: <strong>${currentUserEmail}</strong></p>
                                <p>Start adding products above! 👆</p>
                            </div>`;
                        return;
                    }

                    myProducts.forEach(product => {
                        const card = document.createElement("div");
                        card.classList.add("card");
                        // Use uploaded image or placeholder
                        const imgUrl = product.image.startsWith('http') || product.image.startsWith('/') ? product.image : '/uploads/' + product.image;

                        card.innerHTML = `
                      <img src="${imgUrl}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/150'">
                      <h4>${product.name}</h4>
                      <p>Price: ₹${product.price} / kg</p>
                      <p>Stock: <strong>${product.stock} kg</strong></p>
                      <p>Harvested: ${product.harvestDate ? new Date(product.harvestDate).toLocaleDateString() : 'N/A'}</p>
                      <p>Freshness: ${product.freshness}/10 🌿</p>
                      <button class="delete-btn" onclick="deleteProduct('${product._id}')" style="
                          background: #d9534f;
                          color: white;
                          border: none;
                          padding: 5px 10px;
                          border-radius: 5px;
                          cursor: pointer;
                          margin-top: 10px;
                          width: 100%;
                      ">Delete</button>
                    `;
                        grid.prepend(card);
                    });
                }
            } catch (err) {
                console.error(err);
                document.getElementById("preview-grid").innerHTML = '<p>Error loading products.</p>';
            }
        }

        // Delete Product
        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const res = await fetch(`http://localhost:5000/api/products/${productId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await res.json();

                if (data.success) {
                    alert('Product deleted successfully');
                    loadProducts(); // Reload grid
                } else {
                    alert(data.error || 'Failed to delete product');
                }
            } catch (err) {
                console.error(err);
                alert('Error connecting to server');
            }
        }

        // Handle form submission
        const form = document.getElementById("uploadForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("produce-name").value;
            const price = document.getElementById("produce-price").value;
            const category = document.getElementById("produce-category").value;
            const date = document.getElementById("harvest-date").value;
            const freshness = document.getElementById("freshness").value;
            const qty = document.getElementById("produce-qty").value;
            const desc = document.getElementById("produce-desc").value;
            const fileInput = document.getElementById("produce-image");
            const file = fileInput.files[0];

            if (!file) return alert("Please upload an image!");
            if (!name || !price || !category) return alert("Please fill required fields");

            try {
                // 1. Upload Image
                const formData = new FormData();
                formData.append('image', file);

                const uploadRes = await fetch('http://localhost:5000/api/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const uploadData = await uploadRes.json();

                if (!uploadRes.ok) throw new Error(uploadData.message || 'Image upload failed');

                const imageUrl = uploadData.imageUrl;

                // 2. Create Product
                const productData = {
                    name,
                    description: desc,
                    price,
                    category,
                    stock: qty || 10,
                    freshness,
                    harvestDate: date,
                    image: imageUrl
                };

                const productRes = await fetch('http://localhost:5000/api/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productData)
                });
                const productResult = await productRes.json();

                if (productResult.success) {
                    alert('Product uploaded successfully!');
                    form.reset();
                    document.getElementById("freshness-value").textContent = "8 / 10 🌱";
                    loadProducts();
                } else {
                    alert(productResult.error || 'Failed to create product');
                }

            } catch (err) {
                console.error(err);
                alert('Error: ' + err.message);
            }
        });

        loadProducts();
    </script>




</body>

</html>
