<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Care | Farmer Dashboard</title>
    <link rel="stylesheet" href="farmers.css" />
</head>

<body>
    <header>
        <h1>🌿 Farm Care — Farmer Dashboard</h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="#preview-grid">My Uploads</a>
            <a href="#" id="logout-btn">Logout</a>
        </nav>
    </header>

    <main>
        <section class="upload-section">
            <h2>Upload Your Fresh Produce</h2>
            <p>Share your farmers freshest harvest with consumers directly!</p>

            <form id="uploadForm">

                <!-- Group 1: Produce Name -->
                <div style="margin-bottom: 15px;">
                    <label for="produce-name" style="display:block; margin-bottom:5px; font-weight:bold;">Produce
                        Name:</label>
                    <input type="text" id="produce-name" placeholder="e.g. Mangoes 🥭" required
                        style="width: 100%; box-sizing: border-box;" />
                </div>

                <!-- Group 2: Category & Harvest Date (Row) -->
                <div style="margin-bottom: 15px;">
                    <div style="display: flex; gap: 15px;">
                        <div style="flex: 1;">
                            <label for="produce-category"
                                style="display:block; margin-bottom:5px; font-weight:bold;">Category:</label>
                            <select id="produce-category" required
                                style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;">
                                <option value="" disabled selected>Select Category</option>
                                <option value="Vegetables">Vegetables 🥦</option>
                                <option value="Fruits">Fruits 🍎</option>
                                <option value="Dairy">Dairy 🥛</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label for="harvest-date"
                                style="display:block; margin-bottom:5px; font-weight:bold;">Harvest Date:</label>
                            <input type="date" id="harvest-date" required
                                style="width: 100%; box-sizing: border-box;" />
                        </div>
                    </div>
                </div>

                <!-- Group 3: Description -->
                <div style="margin-bottom: 15px;">
                    <label for="produce-desc"
                        style="display:block; margin-bottom:5px; font-weight:bold;">Description:</label>
                    <textarea id="produce-desc" rows="3"
                        placeholder="Describe your produce (e.g. Organic, fresh picked)..." required
                        style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-family: inherit;"></textarea>
                </div>

                <!-- Group 4: Freshness -->
                <div style="margin-bottom: 15px;">
                    <label for="freshness" style="display:block; margin-bottom:5px; font-weight:bold;">Freshness Scale
                        (1–10):</label>
                    <div class="freshness-scale"
                        style="background:#e8f5e9; padding: 10px; border-radius: 10px; display:flex; align-items:center;">
                        <input type="range" id="freshness" min="1" max="10" value="8"
                            style="margin-bottom: 0; flex:1; margin-right:10px;"
                            oninput="updateFreshness(this.value)" />
                        <span id="freshness-value" style="font-size: 1.2rem; min-width:80px; text-align:right;">8 / 10
                            🌱</span>
                    </div>
                </div>

                <!-- Group 5: Image -->
                <div style="margin-bottom: 20px;">
                    <label for="produce-image" style="display:block; margin-bottom:5px; font-weight:bold;">Upload
                        Produce Image:</label>
                    <input type="file" id="produce-image" accept="image/*" required
                        style="border: 2px dashed #2d572c; background: #f0fdf4; width: 100%; box-sizing: border-box; padding:10px;" />
                </div>

                <button type="submit" style="width: 100%; font-size: 1.2rem;">🚀 Upload Produce</button>
            </form>
        </section>

        <section class="preview-section">
            <h3>My Uploaded Produce</h3>
            <p>Your recently uploaded fruits and vegetables will appear below.</p>
            <div id="preview-grid" class="preview-grid">
                <!-- Farmer’s uploaded items will appear here dynamically -->
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Farm Care | Empowering Farmers with Technology 🌾</p>
    </footer>

    <script>
        // Check Authentication
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        const user = JSON.parse(localStorage.getItem('user') || '{}');

        // Update freshness value display
        function updateFreshness(val) {
            const valueText = document.getElementById("freshness-value");
            const emojis = ["😐", "🙂", "😊", "😁", "😄", "😃", "😋", "🥰", "🌿", "💚"];
            valueText.textContent = `${val} / 10 ${emojis[val - 1]}`;
        }

        // Handle form submission
        const form = document.getElementById("uploadForm");
        const previewGrid = document.getElementById("preview-grid");

        // 📌 Handle Form Submission
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            // Get input values
            const fileInput = document.getElementById("produce-image");
            const file = fileInput.files[0];
            const produceName = document.getElementById("produce-name").value;
            // Price removed as per request
            const produceCategory = document.getElementById("produce-category").value;
            const produceDesc = document.getElementById("produce-desc").value;
            const harvestDate = document.getElementById("harvest-date").value;
            const freshness = document.getElementById("freshness").value;


            if (!produceName || !produceCategory || !produceDesc || !harvestDate || !freshness) {
                alert('Please fill in all fields');
                return;
            }

            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    const imageUrl = event.target.result;

                    // Create Product Element
                    const productEl = document.createElement("div");
                    productEl.classList.add("card"); // Using existing 'card' class for consistency
                    productEl.innerHTML = `
            <img src="${imageUrl}" alt="${produceName}">
            <h4>${produceName}</h4>
            <span style="display:block; text-align:center; color:#555; font-size:0.9rem; margin-bottom:5px;">${produceCategory}</span>
            <p>Freshness: ${freshness}/10 🌿</p>
            <p class="date">Harvested: ${new Date(harvestDate).toLocaleDateString()}</p>
            <button onclick="this.parentElement.remove()" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; margin-top: 10px;">Delete</button>
          `;

                    // Append to My Products section
                    previewGrid.prepend(productEl);

                    // Reset Form
                    form.reset();
                    document.getElementById("freshness-value").textContent = "8 / 10 🌱"; // Reset freshness display
                };
                reader.readAsDataURL(file);
            } else {
                alert("Please upload an image!");
            }
        });

        function prependProduct(product) {
            const card = document.createElement("div");
            card.classList.add("card");
            card.innerHTML = `
                <img src="${product.image}" alt="${product.name}">
                <h4>${product.name}</h4>
                <p>₹${product.price} / kg</p>
                <p>Freshness: ${product.freshness}/10 🌿</p>
                <p class="date">Harvested: ${new Date(product.harvestDate).toLocaleDateString()}</p>
            `;
            previewGrid.prepend(card);
        }

        // Load existing products (Optional: for now just showing new uploads)
        // You can implement a fetch loop here if you want to show previous uploads.

        // Logout functionality
        document.getElementById("logout-btn").addEventListener("click", function (e) {
            e.preventDefault();
            // Only clear session data, keep registered account!
            localStorage.removeItem("username");
            localStorage.removeItem("email");
            localStorage.removeItem("contact");
            localStorage.removeItem("userType");
            localStorage.removeItem("token");

            window.location.href = "login.html";
        });
    </script>
</body>

</html>
