<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Care | Farmer Dashboard</title>
    <link rel="stylesheet" href="farmers.css" />
</head>

<body>
    <header>
        <h1>🌿 Farm Care — Farmer Dashboard</h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="#preview-grid">My Uploads</a>
            <a href="#" id="logout-btn">Logout</a>
        </nav>
    </header>

    <main>
        <section class="upload-section">
            <h2>Upload Your Fresh Produce</h2>
            <p>Share your farmers freshest harvest with consumers directly!</p>

            <form id="uploadForm">
                <label for="produce-name">Produce Name:</label>
                <input type="text" id="produce-name" placeholder="e.g. Mangoes, Tomatoes" required />

                <label for="produce-price">Price (₹ per kg/unit):</label>
                <input type="number" id="produce-price" placeholder="e.g. 50" required />

                <label for="produce-category">Category:</label>
                <select id="produce-category" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="Vegetables">Vegetables</option>
                    <option value="Fruits">Fruits</option>
                    <option value="Dairy">Dairy</option>
                    <option value="Grains">Grains</option>
                    <option value="Other">Other</option>
                </select>

                <label for="produce-desc">Description:</label>
                <textarea id="produce-desc" rows="3" placeholder="Describe your produce..." required></textarea>

                <label for="harvest-date">Harvest Date:</label>
                <input type="date" id="harvest-date" required />

                <label for="freshness">Freshness Scale (1–10):</label>
                <div class="freshness-scale">
                    <input type="range" id="freshness" min="1" max="10" value="8"
                        oninput="updateFreshness(this.value)" />
                    <span id="freshness-value">8 / 10 🌱</span>
                </div>

                <label for="produce-image">Upload Produce Image:</label>
                <input type="file" id="produce-image" accept="image/*" required />

                <button type="submit">Upload Produce</button>
            </form>
        </section>

        <section class="preview-section">
            <h3>My Uploaded Produce</h3>
            <p>Your recently uploaded fruits and vegetables will appear below.</p>
            <div id="preview-grid" class="preview-grid">
                <!-- Farmer’s uploaded items will appear here dynamically -->
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Farm Care | Empowering Farmers with Technology 🌾</p>
    </footer>

    <script>
        // Check Authentication
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        const user = JSON.parse(localStorage.getItem('user') || '{}');

        // Update freshness value display
        function updateFreshness(val) {
            const valueText = document.getElementById("freshness-value");
            const emojis = ["😐", "🙂", "😊", "😁", "😄", "😃", "😋", "🥰", "🌿", "💚"];
            valueText.textContent = `${val} / 10 ${emojis[val - 1]}`;
        }

        // Handle form submission
        const form = document.getElementById("uploadForm");
        const previewGrid = document.getElementById("preview-grid");

        // 📌 Handle Form Submission
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            // Get input values
            const fileInput = document.getElementById("produce-image");
            const file = fileInput.files[0];
            const produceName = document.getElementById("produce-name").value;
            const producePrice = document.getElementById("produce-price").value;
            const produceCategory = document.getElementById("produce-category").value;
            const produceDesc = document.getElementById("produce-desc").value;
            const harvestDate = document.getElementById("harvest-date").value;
            const freshness = document.getElementById("freshness").value;


            if (!produceName || !producePrice || !produceCategory || !produceDesc || !harvestDate || !freshness) {
                alert('Please fill in all fields');
                return;
            }

            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    const imageUrl = event.target.result;

                    // Create Product Element
                    const productEl = document.createElement("div");
                    productEl.classList.add("card"); // Using existing 'card' class for consistency
                    productEl.innerHTML = `
            <img src="${imageUrl}" alt="${produceName}">
            <h4>${produceName}</h4>
            <p>₹${producePrice} / kg</p>
            <p>Freshness: ${freshness}/10 🌿</p>
            <p class="date">Harvested: ${new Date(harvestDate).toLocaleDateString()}</p>
            <button onclick="this.parentElement.remove()" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; margin-top: 10px;">Delete</button>
          `;

                    // Append to My Products section
                    previewGrid.prepend(productEl);

                    // Reset Form
                    form.reset();
                    document.getElementById("freshness-value").textContent = "8 / 10 🌱"; // Reset freshness display
                };
                reader.readAsDataURL(file);
            } else {
                alert("Please upload an image!");
            }
        });

        function prependProduct(product) {
            const card = document.createElement("div");
            card.classList.add("card");
            card.innerHTML = `
                <img src="${product.image}" alt="${product.name}">
                <h4>${product.name}</h4>
                <p>₹${product.price} / kg</p>
                <p>Freshness: ${product.freshness}/10 🌿</p>
                <p class="date">Harvested: ${new Date(product.harvestDate).toLocaleDateString()}</p>
            `;
            previewGrid.prepend(card);
        }

        // Load existing products (Optional: for now just showing new uploads)
        // You can implement a fetch loop here if you want to show previous uploads.

        // Logout functionality
        document.getElementById("logout-btn").addEventListener("click", function (e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = "login.html";
        });
    </script>
</body>

</html>
