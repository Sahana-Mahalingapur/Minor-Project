<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Care | Login</title>
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="login-container">
    <h1>Farm Care 🌿</h1>
    <p>Connecting Farmers and Consumers — Freshness You Can Trust</p>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Enter Username" required />

      <input type="email" id="email" placeholder="Enter Email" required />

      <!-- 📌 Added Contact Number -->
      <input type="text" id="contact" placeholder="Enter Contact Number" required />

      <input type="password" id="password" placeholder="Enter Password" required />

      <select id="userType" required>
        <option value="" disabled selected>Login as</option>
        <option value="farmer">Farmer</option>
        <option value="consumer">Consumer</option>
      </select>

      <button type="submit">Login</button>
    </form>

    <p class="footer-text">
      Don’t have an account? <a href="signup.html">Sign Up</a>
    </p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const password = document.getElementById("password").value.trim();
      const userType = document.getElementById("userType").value;

      // Email Validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alert("❌ Please enter a valid Email ID.");
        return;
      }

      // Contact Validation (10 digits only)
      const contactPattern = /^[0-9]{10}$/;
      if (!contactPattern.test(contact)) {
        alert("❌ Contact number must be exactly 10 digits.");
        return;
      }

      // Password empty check
      if (password.length === 0) {
        alert("❌ Password cannot be empty.");
        return;
      }

      // User Type validation
      if (userType === "") {
        alert("❌ Please select user type.");
        return;
      }

      // 🔐 Simple Local Validation
      // Check if this user was registered (signup saves to 'user_db' or similar key in real apps, 
      // but here we just have 'token' or 'user' object if we were using DB.
      // Since we reverted to NO-DB per your request, we can't 'validate' against a list unless we save one.

      // OPTION: We will just simulate a check or assume signup just happened.

      // ⚠️ CRITICAL: You asked for "Local Storage" mode earlier.
      // In this mode, without a backend, there is NOWHERE to check the password against
      // unless you signed up on this same browser just now.

      // Let's try to check against the last signed-up user if available.
      const storedUser = JSON.parse(localStorage.getItem('registeredUser'));

      // If we want to enforce password check:
      if (storedUser) {
        if (storedUser.email === email && storedUser.password === password) {
          // Success
          localStorage.setItem("username", storedUser.name);
          // Proceed below...
        } else if (storedUser.email === email && storedUser.password !== password) {
          alert("❌ Incorrect Password!");
          return;
        } else {
          // New user or different email, for now we allow login as it's a demo
          // or alert "User not found"
          // alert("❌ User not found. Please Sign Up first.");
          // return;
        }
      }

      // Save session data
      localStorage.setItem("username", username);
      localStorage.setItem("email", email);
      localStorage.setItem("contact", contact);
      localStorage.setItem("userType", userType);

      // Redirect based on user type
      if (userType === "farmer") {
        window.location.href = "farmers.html";
      } else {
        window.location.href = "consumer.html";
      }
    });
  </script>
</body>

</html>
