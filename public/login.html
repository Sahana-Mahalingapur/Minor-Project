<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Care | Login</title>
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="login-container">
    <h1>Farm Care 🌿</h1>
    <p>Connecting Farmers and Consumers — Freshness You Can Trust</p>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Enter Username" required />

      <input type="email" id="email" placeholder="Enter Email" required />

      <!-- 📌 Added Contact Number -->
      <input type="text" id="contact" placeholder="Enter Contact Number" required />

      <input type="password" id="password" placeholder="Enter Password" required />

      <select id="userType" required>
        <option value="" disabled selected>Login as</option>
        <option value="farmer">Farmer</option>
        <option value="consumer">Consumer</option>
      </select>

      <button type="submit">Login</button>
    </form>

    <p class="footer-text">
      Don’t have an account? <a href="signup.html">Sign Up</a>
    </p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const password = document.getElementById("password").value.trim();
      const userType = document.getElementById("userType").value;

      // Email Validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alert("❌ Please enter a valid Email ID.");
        return;
      }

      // Contact Validation (10 digits only)
      const contactPattern = /^[0-9]{10}$/;
      if (!contactPattern.test(contact)) {
        alert("❌ Contact number must be exactly 10 digits.");
        return;
      }

      // Password empty check
      if (password.length === 0) {
        alert("❌ Password cannot be empty.");
        return;
      }

      // User Type validation
      if (userType === "") {
        alert("❌ Please select user type.");
        return;
      }

      // 🔐 STRICT Local Validation
      const storedUser = JSON.parse(localStorage.getItem('registeredUser'));

      if (!storedUser) {
        alert("❌ No registered user found. Please Sign Up first!");
        return;
      }

      if (storedUser.email === email) {
        if (storedUser.password === password) {
          // ✅ Success: Login
          localStorage.setItem("username", storedUser.name);
        } else {
          // ❌ Wrong Password
          alert("❌ Incorrect Password!");
          return;
        }
      } else {
        // ❌ Wrong Email
        alert("❌ User not found with this email.");
        return;
      }

      // Save session data
      localStorage.setItem("username", storedUser.name);
      localStorage.setItem("email", storedUser.email);
      localStorage.setItem("contact", storedUser.phone);
      localStorage.setItem("token", "local-demo-token"); // Set dummy token to bypass auth checks in farmers.html

      // Enforce the registered role!
      // If they signed up as Farmer, they MUST login as Farmer (or we update their role, but for now stick to signup)
      // Actually, typically you login with just email/pass and the backend tells you your role.
      // Here, we trust the storedUser.role
      const finalRole = storedUser.role || userType;
      localStorage.setItem("userType", finalRole);

      // Redirect based on FINAL ROLE
      if (finalRole === "farmer") {
        window.location.href = "farmers.html";
      } else {
        window.location.href = "consumer.html";
      }
    });
  </script>
</body>

</html>
