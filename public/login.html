<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Care | Login</title>
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="login-container">
    <h1>Farm Care 🌿</h1>
    <p>Connecting Farmers and Consumers — Freshness You Can Trust</p>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Enter Username" required />

      <input type="email" id="email" placeholder="Enter Email" required />

      <!-- 📌 Added Contact Number -->
      <input type="text" id="contact" placeholder="Enter Contact Number" required />

      <input type="password" id="password" placeholder="Enter Password" required />

      <select id="userType" required>
        <option value="" disabled selected>Login as</option>
        <option value="farmer">Farmer</option>
        <option value="consumer">Consumer</option>
      </select>

      <button type="submit">Login</button>
    </form>

    <p class="footer-text">
      Don’t have an account? <a href="signup.html">Sign Up</a>
    </p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const userType = document.getElementById("userType").value;
      // Note: Username and Contact fields in form are visual only if using backend auth which typically uses email/pass.
      // However, if your specific backend requires them, include them. 
      // Based on standard authcontroller usually it's email + password. 
      // The form has username/contact inputs which might be confusing for login vs signup. 
      // I will assume standard login uses email/password.

      if (!email || !password || !userType) {
        alert("❌ Please fill in all fields.");
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role: userType })
        });

        const data = await res.json();

        if (data.success) {
          // 🔒 Security Check: Ensure selected role matches account role
          // Backend usually returns user object
          if (userType !== data.role) { // Assuming backend returns role in root or data.user.role
            // Fallback check if backend structure differs
            const dataRole = data.role || (data.user && data.user.role);
            if (dataRole && userType !== dataRole) {
              alert(`⚠️ Access Denied: This account is registered as a "${dataRole}". Please change "Login as" to "${dataRole}".`);
              return;
            }
          }

          // Save token and user info
          localStorage.setItem('token', data.token);
          localStorage.setItem('userType', data.role);
          localStorage.setItem('username', data.name);
          localStorage.setItem('email', data.email);

          if (data.phone) localStorage.setItem('contact', data.phone);

          const userObj = {
            name: data.name,
            email: data.email,
            role: data.role,
            _id: data._id
          };
          localStorage.setItem('user', JSON.stringify(userObj));

          alert('Login Successful! ✅');

          if (data.role === 'farmer') {
            window.location.href = 'farmers.html'; // Navigate to same folder
          } else {
            window.location.href = 'consumer.html';
          }
        } else {
          alert(data.error || 'Login failed. Please check your credentials.');
        }
      } catch (err) {
        console.error(err);
        alert('❌ Error connecting to server. Is the backend running?');
      }
    });
  </script>
</body>

</html>
